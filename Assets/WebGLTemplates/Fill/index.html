<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0B1E4F; }
      #unity-canvas { display: block; width: 100%; height: 100%; background: #0B1E4F; outline: none; }
      #loading { position: fixed; left: 30%; right: 30%; top: 50%; height: 6px; background: #13306E; }
      #loading div { height: 100%; width: 0; background: #FFD447; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading"><div></div></div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#loading");
      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      }, function (progress) {
        loading.firstElementChild.style.width = 100 * progress + "%";
      }).then(function () {
        loading.remove();
        canvas.focus();
      }).catch(function (message) {
        loading.textContent = message;
        loading.style.color = "#fff";
        loading.style.background = "none";
      });
    </script>
  </body>
</html>
