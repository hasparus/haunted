name: Deploy to itch.io

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      targets:
        description: 'Comma-separated targets to build (empty = all)'
        required: false
        default: ''

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    if: vars.ITCH_GAME != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: WebGL
            target: WebGL
            channel: html5
            path: build/WebGL/haunted
          - name: Windows
            target: StandaloneWindows64
            channel: windows
            path: build/StandaloneWindows64
          - name: macOS
            target: StandaloneOSX
            channel: mac
            path: build/StandaloneOSX
          - name: Linux
            target: StandaloneLinux64
            channel: linux
            path: build/StandaloneLinux64
    steps:
      - name: Add swap (Unity import can OOM on hosted runners)
        if: ${{ !inputs.targets || contains(inputs.targets, matrix.target) }}
        run: |
          sudo fallocate -l 8G /extra-swap
          sudo chmod 600 /extra-swap
          sudo mkswap /extra-swap
          sudo swapon /extra-swap
          free -h

      - uses: actions/checkout@v4
        if: ${{ !inputs.targets || contains(inputs.targets, matrix.target) }}
        with:
          fetch-depth: 0
          lfs: true

      - uses: actions/cache@v4
        if: ${{ !inputs.targets || contains(inputs.targets, matrix.target) }}
        with:
          path: Library
          key: Library-${{ matrix.target }}-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-${{ matrix.target }}-

      - name: Version
        id: version
        if: ${{ !inputs.targets || contains(inputs.targets, matrix.target) }}
        run: echo "value=$(git describe --tags --always | sed 's/^v//')" >> "$GITHUB_OUTPUT"

      - uses: game-ci/unity-builder@v4
        if: ${{ !inputs.targets || contains(inputs.targets, matrix.target) }}
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.target }}
          buildName: haunted
          versioning: Custom
          version: ${{ steps.version.outputs.value }}
          dockerShmSize: 4g
          # The default cap is 95% of RAM, which leaves the swap above unused; WebGL linking needs it.
          dockerMemoryLimit: 22g

      # Zipped here because upload-artifact drops executable bits.
      - name: Zip build
        if: startsWith(github.ref, 'refs/tags/')
        run: cd "${{ matrix.path }}" && zip -qry "$GITHUB_WORKSPACE/haunted-${{ matrix.channel }}.zip" .

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: ${{ matrix.channel }}
          path: haunted-${{ matrix.channel }}.zip
          retention-days: 3

      - name: Push to itch.io
        if: ${{ !inputs.targets || contains(inputs.targets, matrix.target) }}
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_GAME: ${{ vars.ITCH_GAME }}
        run: |
          curl -sSfL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler
          chmod +x butler/butler
          butler/butler push "${{ matrix.path }}" "$ITCH_GAME:${{ matrix.channel }}" --userversion "${GITHUB_REF_NAME}-${GITHUB_SHA::7}"

  release:
    needs: build
    if: ${{ !cancelled() && vars.ITCH_GAME != '' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ITCH_GAME: ${{ vars.ITCH_GAME }}
        run: |
          shopt -s nullglob
          files=(dist/*.zip)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            if (( ${#files[@]} )); then gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber; fi
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --verify-tag --generate-notes \
              --notes "Play in the browser or download on itch.io: https://${ITCH_GAME%%/*}.itch.io/${ITCH_GAME#*/}"
          fi
